<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Connect - Registration</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="hero register-hero">
        <h1 id="registrationHeading">Join the Fun!</h1>
        <p class="tagline">Save your spot at your favourite event.</p>
        <p>Fill in your details below to register.</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="register.html">Registration</a>
    </nav>

    <main class="container">
        <div class="center">
            <button onclick="changeRegistrationFont()">Change Heading Size</button>
            <button onclick="toggleRegistrationForm()">Show / Hide Form</button>
        </div>

        <section class="form-box registration-box" id="registrationFormBox">
            <h2>📝 Student Registration</h2>
            <form id="registrationForm" onsubmit="registerStudent(event)">
                <label for="studentName">Student Name:</label>
                <input type="text" id="studentName" placeholder="Enter your full name" required>

                <label for="rollNumber">Student Roll Number:</label>
                <input type="text" id="rollNumber" placeholder="Enter your roll number" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" placeholder="Enter your email address" required>

                <label for="selectedEvent">Choose an Event:</label>
                <select id="selectedEvent" required>
                    <option value="">-- Select an event --</option>
                    <option value="Tech Fest 2026">Tech Fest 2026</option>
                    <option value="Hackathon">Hackathon</option>
                    <option value="Cultural Night">Cultural Night</option>
                    <option value="Sports Meet">Sports Meet</option>
                    <option value="Photography Contest">Photography Contest</option>
                    <option value="Dance Competition">Dance Competition</option>
                </select>

                <button type="submit" class="submit-button">Register Me!</button>
            </form>
            <p id="registrationMessage" aria-live="polite"></p>
            <p class="small-note">This is a student project demonstration. Your details are not saved to a database.</p>
        </section>
    </main>

    <footer><p>Made with 💜 by Campus Connect | 2026</p></footer>
</body>
</html>
